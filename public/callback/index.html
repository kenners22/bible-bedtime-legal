<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Bedtime TikTok Authorization</title>
  <meta name="description" content="Bible Bedtime TikTok OAuth callback page for receiving an authorization code during the local publishing workflow.">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f8f7f3;
      color: #1f2933;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    code {
      display: block;
      margin-top: 12px;
      padding: 14px;
      overflow-wrap: anywhere;
      background: #ffffff;
      border: 1px solid #d8d4c8;
      border-radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #171717;
        color: #f5f1e8;
      }

      code {
        background: #222;
        border-color: #3a3a3a;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok authorization received</h1>
    <p id="message">Checking the authorization response...</p>
    <code id="code" hidden></code>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const message = document.getElementById("message");
    const codeBlock = document.getElementById("code");

    if (code) {
      message.textContent = "Copy this authorization code back into the local TikTok OAuth helper.";
      codeBlock.hidden = false;
      codeBlock.textContent = code;
    } else if (error) {
      message.textContent = `TikTok returned an authorization error: ${error}`;
    } else {
      message.textContent = "No authorization code was found in this URL.";
    }
  </script>
</body>
</html>
